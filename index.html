<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archivo Confidencial: Aranxita</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Oswald for Headers (Military/Industrial), Special Elite for Body (Typewriter/Dossier) -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              're-black': '#0a0a0a',
              're-sepia': '#2c241b',
              're-dust': '#8c7b64',
              're-olive': '#3d4035',
              're-red': '#661818',
              're-paper': '#dcd0c0',
              're-ink': '#2b2621',
            },
            fontFamily: {
              'header': ['Oswald', 'sans-serif'],
              'body': ['Special Elite', 'monospace'],
            },
            backgroundImage: {
              'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.1%22/%3E%3C/svg%3E')",
            },
            animation: {
              'fade-in-up': 'fadeInUp 2.5s ease-out forwards',
              'grain': 'grain 8s steps(10) infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              grain: {
                '0%, 100%': { transform: 'translate(0, 0)' },
                '10%': { transform: 'translate(-5%, -5%)' },
                '20%': { transform: 'translate(-10%, 5%)' },
                '30%': { transform: 'translate(5%, -10%)' },
                '40%': { transform: 'translate(-5%, 15%)' },
                '50%': { transform: 'translate(-10%, 5%)' },
                '60%': { transform: 'translate(15%, 0)' },
                '70%': { transform: 'translate(0, 10%)' },
                '80%': { transform: 'translate(-15%, 0)' },
                '90%': { transform: 'translate(10%, 5%)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for that tactical OS feel */
      ::-webkit-scrollbar {
        width: 8px;
        background: #0a0a08;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a08; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3d4035; 
        border: 1px solid #1a1814;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8c7b64; 
      }
      
      .text-shadow-sm {
        text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
      }
      .text-shadow-glow {
        text-shadow: 0 0 10px rgba(255,200,100,0.2);
      }
      
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        /* Allow scroll but keep background color */
        background-color: #0a0a0a;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-re-black text-re-dust">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
